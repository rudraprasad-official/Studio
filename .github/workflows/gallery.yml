name: Update and Deploy Studio Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: studio-gallery
  cancel-in-progress: false

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate photo database
        run: |
          python3 <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path

          database = Path("photos.json")

          existing = json.loads(
              database.read_text(encoding="utf-8")
          ) if database.exists() else []

          saved = {
              photo["image"]: photo
              for photo in existing
          }

          categories = [
              "Underwater",
              "Wildlife",
              "Landscape",
              "Nature",
              "Travel",
              "Aerial",
              "Portrait",
              "Architecture"
          ]

          extensions = {
              ".jpg", ".jpeg", ".png", ".webp"
          }

          photos = []

          for file in sorted(Path("photos").glob("*")):

              if not file.is_file():
                  continue

              if file.suffix.lower() not in extensions:
                  continue

              path = file.as_posix()

              if path in saved:
                  photos.append(saved[path])
                  continue

              name = file.stem

              category = next(
                  (c for c in categories
                   if name.lower().startswith(c.lower())),
                  "Nature"
              )

              clean_name = re.sub(
                  r"^" + re.escape(category) + r"[-_]+",
                  "",
                  name,
                  flags=re.IGNORECASE
              )

              title = re.sub(
                  r"[-_]+", " ", clean_name
              ).title()

              photo_id = "RP-" + hashlib.sha256(
                  path.encode()
              ).hexdigest()[:10].upper()

              photo = {
                  "id": photo_id,
                  "title": title,
                  "category": category,
                  "location": "",
                  "image": path,
                  "description": "Original photography by Rudra Prasad Studio.",
                  "camera": "",
                  "personal": 19.99,
                  "commercial": 49.99,
                  "extended": 149.99,
                  "checkout": {}
              }

              photos.append(photo)

          database.write_text(
              json.dumps(
                  photos,
                  indent=4,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

          print(f"Gallery updated: {len(photos)} photographs")
          PY

      - name: Save updated gallery
        run: |
          git config user.name "Studio Gallery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add photos.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update photo gallery"
            git push
          fi

      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: update-gallery
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Studio Website
        id: deployment
        uses: actions/deploy-pages@v4
