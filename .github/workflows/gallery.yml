name: Update Photography Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'photos/**'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-gallery
  cancel-in-progress: false

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate photo database
        run: |
          python3 <<'PY'
          import json
          import re
          import hashlib
          from pathlib import Path

          database = Path("photos.json")

          existing = json.loads(
              database.read_text(encoding="utf-8")
          ) if database.exists() else []

          saved = {
              photo["image"]: photo
              for photo in existing
          }

          defaults = {
              "photos/landscape01.jpg": {
                  "id": "RP003",
                  "title": "Himalayan Silence",
                  "category": "Landscape",
                  "location": "Uttarakhand, India",
                  "description": "A moment of tranquillity in the magnificent Himalayas."
              },
              "photos/nature01.jpg": {
                  "id": "RP006",
                  "title": "Natural Harmony",
                  "category": "Nature",
                  "description": "Capturing the details and colours of the natural world."
              }
          }

          categories = [
              "Underwater",
              "Wildlife",
              "Landscape",
              "Nature",
              "Travel",
              "Aerial",
              "Portrait",
              "Architecture"
          ]

          extensions = {
              ".jpg", ".jpeg", ".png", ".webp"
          }

          photos = []

          for file in sorted(Path("photos").glob("*")):

              if not file.is_file():
                  continue

              if file.suffix.lower() not in extensions:
                  continue

              path = file.as_posix()

              if path in saved:
                  photos.append(saved[path])
                  continue

              name = file.stem

              category = next(
                  (c for c in categories
                   if name.lower().startswith(c.lower())),
                  "Nature"
              )

              title = re.sub(r"[-_]+", " ", name).title()

              photo_id = "RP-" + hashlib.sha256(
                  path.encode()
              ).hexdigest()[:10].upper()

              photo = {
                  "id": photo_id,
                  "title": title,
                  "category": category,
                  "location": "",
                  "image": path,
                  "description": "Original photography by Rudra Prasad Studio.",
                  "camera": "",
                  "personal": 19.99,
                  "commercial": 49.99,
                  "extended": 149.99,
                  "checkout": {}
              }

              photo.update(defaults.get(path, {}))
              photos.append(photo)

          database.write_text(
              json.dumps(photos, indent=4, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print(f"Gallery updated: {len(photos)} photographs")
          PY

      - name: Save updated gallery
        run: |
          git config user.name "Studio Gallery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update photo gallery"
            git push
          fi
